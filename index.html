<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albufeira Pulse | Town Event Calendar & Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        miamiPink: '#FF2A85',
                        miamiCyan: '#06B6D4',
                        miamiDark: '#0B0F19',
                        miamiCard: '#131B2E',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pulseColor {
            0% { color: #FF2A85; transform: scale(1); filter: drop-shadow(0 0 4px #FF2A85); }
            33% { color: #06B6D4; transform: scale(1.25); filter: drop-shadow(0 0 12px #06B6D4); }
            66% { color: #A855F7; transform: scale(1); filter: drop-shadow(0 0 8px #A855F7); }
            100% { color: #FF2A85; transform: scale(1); filter: drop-shadow(0 0 4px #FF2A85); }
        }
        .animate-pulse-color {
            animation: pulseColor 3s infinite ease-in-out;
        }
        /* 80s Synthwave Cartoon Palm Sunset Vector Background Wallpaper */
        body {
            background-image: linear-gradient(to bottom, rgba(15, 5, 29, 0.85), rgba(30, 10, 50, 0.90)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-miamiCard/95 backdrop-blur-md border-b border-miamiPink/30 sticky top-0 z-50 shadow-lg shadow-miamiPink/10">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <!-- Brand with Larger Frameless Pulsating Heart Logo -->
            <div class="flex items-center gap-3">
                <div class="flex items-center justify-center p-1">
                    <svg class="w-9 h-9 animate-pulse-color" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-miamiPink to-miamiCyan bg-clip-text text-transparent">ALBUFEIRA PULSE</h1>
                    <p class="text-xs text-gray-400">The Live Beat of the Algarve</p>
                </div>
            </div>

            <!-- Town Switcher -->
            <div class="flex items-center gap-2 bg-black/40 p-1.5 rounded-xl border border-white/10">
                <span class="text-xs font-semibold px-2 text-miamiCyan flex items-center gap-1">
                    <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Town:
                </span>
                <select id="townSelect" onchange="changeTown(this.value)" class="bg-miamiCard text-xs font-bold text-white px-3 py-1.5 rounded-lg border border-miamiCyan/40 focus:outline-none focus:border-miamiPink cursor-pointer">
                    <option value="Albufeira">Albufeira (Main)</option>
                    <option value="Silves">Silves</option>
                    <option value="All Algarve">All Algarve</option>
                </select>
